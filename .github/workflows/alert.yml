name: P2P Alert Bot COP

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar bot de alertas
        env:
          TG_USERNAME:   ${{ secrets.TG_USERNAME }}
          UMBRAL_PCT:    ${{ secrets.UMBRAL_PCT }}
          MAKER_FEE_COP: ${{ secrets.MAKER_FEE_COP }}
          GH_PAT:        ${{ secrets.GH_PAT }}
        run: python "P2P-Radar-Anuncios-main/P2P-Radar-Anuncios-main/alert_bot.py"

      - name: Keep alive via API
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          curl -s -X PUT \
            -H "Authorization: token $GH_PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/sebastianclavijocode/p2p-radar-cop/actions/workflows/alert.yml/enable"
          echo "✅ Workflow re-habilitado"
